<!DOCTYPE html>
<html>
<head>
	<title>Leaflet debug page</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="https://unpkg.com/leaflet@2.0.0-beta.2/dist/leaflet.css" crossorigin=""/>

	<script type="importmap">
		{
			"imports": {
				"leaflet": "https://unpkg.com/leaflet@2.0.0-beta.2/dist/leaflet.js"
			}
		}
	</script>

	<script type="module">
		import * as L from 'leaflet';
		import { imageOverlayRotated } from './Leaflet.ImageOverlay.Rotated.js';

		const map = new L.Map('map');

		new L.TileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
			attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://cartodb.com/attributions">CartoDB</a>',
			maxNativeZoom: 18,
			maxZoom: 24
		}).addTo(map);

		document.getElementById('leaflet-version').textContent =
			'Leaflet ' + L.version + ' · leaflet-imageoverlay-rotated (1.x/2.x)';

		const point1 = new L.LatLng(40.52256691873593, -3.7743186950683594),
		      point2 = new L.LatLng(40.5210255066156, -3.7734764814376835),
		      point3 = new L.LatLng(40.52180437272552, -3.7768453359603886);

		const marker1 = new L.Marker(point1, {draggable: true}).addTo(map),
		      marker2 = new L.Marker(point2, {draggable: true}).addTo(map),
		      marker3 = new L.Marker(point3, {draggable: true}).addTo(map);

		const bounds = new L.LatLngBounds(point1, point2).extend(point3);
		map.fitBounds(bounds);

		const overlay = imageOverlayRotated('./palacio-de-el-pardo-821175.jpg', point1, point2, point3, {
			opacity: 0.4,
			interactive: true,
			attribution: 'Historical building plan &copy; <a href="https://www.ign.es">Instituto Geográfico Nacional de España</a>'
		}).addTo(map);

		function repositionImage() {
			overlay.reposition(marker1.getLatLng(), marker2.getLatLng(), marker3.getLatLng());
		}

		marker1.on('drag dragend', repositionImage);
		marker2.on('drag dragend', repositionImage);
		marker3.on('drag dragend', repositionImage);

		overlay.on('dblclick', () => console.log('Double click on image.'));
		overlay.on('click', () => console.log('Click on image.'));

		window.setOverlayOpacity = (opacity) => overlay.setOpacity(opacity);
	</script>

</head>
<body>

	<div id="map" style='width:800px; height:600px;'></div>
	<div id="leaflet-version"></div>
	<div>
	Overlay opacity:
	<button onclick='setOverlayOpacity(0.1)'>10%</button>
	<button onclick='setOverlayOpacity(0.2)'>20%</button>
	<button onclick='setOverlayOpacity(0.3)'>30%</button>
	<button onclick='setOverlayOpacity(0.4)'>40%</button>
	<button onclick='setOverlayOpacity(0.5)'>50%</button>
	<button onclick='setOverlayOpacity(0.6)'>60%</button>
	<button onclick='setOverlayOpacity(0.7)'>70%</button>
	<button onclick='setOverlayOpacity(0.8)'>80%</button>
	<button onclick='setOverlayOpacity(0.9)'>90%</button>
	</div>

</body>
</html>
